# Local development stack. Ports 8000-8002 and 3000-3001 are reserved by other
# contextbox projects, so this project stays on 6333/6334 (Qdrant) and will use
# 8010 (API) / 8501 (dashboard) once those land in T8.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-legal-system-qdrant
    ports:
      - "6333:6333" # HTTP + dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
    restart: unless-stopped
    healthcheck:
      # The image is distroless — no curl/wget — so probe via the bundled binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
