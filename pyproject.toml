[project]
name = "rag-legal-system"
version = "0.1.0"
description = "RAG tra cứu văn bản pháp luật Việt Nam — dựng theo hướng đo được, gỡ lỗi được, cải thiện được"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-genai>=1.0,<2",
  "huggingface-hub>=0.34,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "qdrant-client>=1.12,<2",
  "rich>=13.7,<15",
  "tenacity>=9.1,<10",
  "typer>=0.16,<1",
  # NOTE(T0 scope): bm25s / pyvi / underthesea / scipy are T2 (lexical search)
  # dependencies — deliberately not added here so the dependency graph matches
  # what T0 actually uses. Add them when T2 starts.
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

# Repo-root import layout per docs/plan.md §5: `config/` and `src/` are
# imported directly, so this project is not built or installed as a
# distribution.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "live: hits a real provider API and costs money (deselected by default)",
]

[tool.coverage.run]
branch = true
source = ["src", "config"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
